services:

  ollama:
    image: ollama/ollama:latest
    container_name: serena-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: serena-api
    ports:
      - "8001:8000"
    volumes:
      - ./backend/datos:/app/backend/datos
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODELO_LLM=qwen3:1.7b
      - TEMPERATURA=0.2
      - CONTEXTO=1024
      - HILOS=4
      - RESULTADOS_TOP=2
      - DIRECTORIO_EMBEDDINGS=./backend/datos/embeddings
      - COLECCION=serena_conocimiento
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data: